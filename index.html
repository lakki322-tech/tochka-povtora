<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#43545b"><title>Точка повтора — рабочая тетрадь</title><style>
:root{--ink:#43545b;--muted:#667d7d;--bg:#f6f8f6;--pale:#eef3f0;--border:#ccd8d4;--white:#fff;--accent:#557b70}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);line-height:1.55}.shell{max-width:720px;margin:auto;padding:18px 16px 95px}.brand{font-size:11px;letter-spacing:.14em;font-weight:750;color:var(--muted)}h1{font-size:clamp(26px,6vw,38px);line-height:1.18;margin:12px 0 8px}h2{font-size:23px;line-height:1.3;margin:8px 0 14px}.muted{color:var(--muted)}.card{background:white;border:1px solid var(--border);border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 3px 15px #324b4208}.note{background:var(--pale);padding:13px 15px;border-radius:12px;font-size:14px;margin:15px 0}.step{font-size:12px;font-weight:750;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}.progress{height:6px;background:#dbe6e1;border-radius:99px;overflow:hidden;margin:15px 0 8px}.fill{height:100%;background:var(--accent);transition:width .2s}label{display:block;font-size:15px;font-weight:700;margin:22px 0 8px}textarea{width:100%;min-height:126px;resize:vertical;border:1.5px solid var(--border);border-radius:12px;padding:14px;font:16px/1.5 inherit;color:var(--ink);background:#fff}textarea:focus{outline:3px solid #c6e2d8;border-color:var(--accent)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}button{appearance:none;border:1px solid var(--border);background:white;color:var(--ink);border-radius:11px;padding:13px 16px;font:700 14px inherit;cursor:pointer;min-height:46px}button.primary{background:var(--ink);color:white;border-color:var(--ink)}button:disabled{opacity:.4;cursor:default}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button{font-size:12px;padding:9px 12px;min-height:38px}.footer{font-size:12px;color:var(--muted);margin-top:22px}.check{display:flex;gap:10px;align-items:flex-start;margin:14px 0;font-size:15px}.check input{width:19px;height:19px;accent-color:var(--accent)}.hide{display:none}.status{font-size:12px;color:var(--muted);min-height:18px}.warn{color:#8b573d}details{margin-top:14px}summary{cursor:pointer;font-weight:700}.header{display:flex;justify-content:space-between;align-items:center;gap:10px}@media(max-width:480px){.card{padding:18px}.actions button{flex:1}.tools{margin-top:12px}}@media print{body{background:white}.shell{max-width:none;padding:0}.card{box-shadow:none;border:0}.tools,.actions,.progress,.status,details{display:none!important}textarea{border:1px solid #bbb;min-height:60px} .shell{padding:0} }
</style></head><body><main class="shell"><div class="header"><div class="brand">ВАРВАРА ПЛОХОТНИКОВА</div><div class="status" id="status" aria-live="polite"></div></div><h1>Точка повтора</h1><p class="muted">Личная рабочая тетрадь к четырём аудио</p><div class="progress"><div id="bar" class="fill" style="width:0"></div></div><div class="header"><span class="step" id="counter"></span><span class="muted" style="font-size:12px">Ответы остаются на этом устройстве</span></div><div class="tools"><button id="save">Скачать ответы</button><button id="import">Загрузить сохранённые ответы</button><button id="print">Печать / PDF</button><button id="reset">Очистить</button></div><input type="file" id="file" accept=".json,application/json" class="hide"><section class="card" id="content"></section><div class="actions"><button id="prev">← Назад</button><button class="primary" id="next">Далее →</button></div><p class="footer">Вы можете делать паузы, возвращаться к ответам и менять их. Нет правильных или неправильных ответов. Если становится тяжело, остановитесь. Практика не заменяет профессиональную помощь.</p></main><script>
const sections=[["Аудио 1", "Один конкретный эпизод", "После вопросов Варвары поставьте запись на паузу. Запишите наблюдаемые факты: кто, что, когда сказал или сделал.", [["Что конкретно произошло? Что было сказано или сделано?", "Например: в пятницу коллега перебила меня на встрече."], ["Что я сделал(а) или не сделал(а) в ответ?", ""], ["Чем закончилась ситуация? Что произошло после?", ""]]], ["Аудио 2 · часть 1", "Что происходило внутри?", "Работайте с тем же эпизодом, который описали в аудио 1.", [["Какая первая мысль возникла в тот момент?", ""], ["Чего я ожидал(а) от другого человека или ситуации?", ""], ["Что я почувствовал(а)?", "Можно написать «не знаю»."]]], ["Аудио 2 · часть 2", "Чего я избегал(а) и что сохранял(а)?", "Продолжайте размышлять о первом эпизоде.", [["Чего я хотел(а) избежать? Что могло случиться, если бы я поступил(а) иначе?", ""], ["Что я пытался(лась) получить или сохранить?", "Например: спокойствие, одобрение или отношения — только если подходит вам."]]], ["Аудио 3 · случай 1", "Первый случай", "Это эпизод, который вы уже разобрали. Кратко перенесите сюда главное.", [["Что произошло, что я подумал(а), почувствовал(а), сделал(а)? Чем закончилось?", ""]]], ["Аудио 3 · случай 2", "Второй случай", "Вспомните другой конкретный эпизод со знакомым ощущением.", [["Что произошло, что я подумал(а), почувствовал(а), сделал(а)? Чем закончилось?", ""]]], ["Аудио 3 · случай 3", "Третий случай", "Вспомните ещё один конкретный эпизод. Он может быть из другой сферы жизни.", [["Что произошло, что я подумал(а), почувствовал(а), сделал(а)? Чем закончилось?", ""]]], ["Аудио 3 · сравнение", "Что общего, а что различается?", "Посмотрите на три ситуации. Сходство находить необязательно.", [["Что повторяется? Мысли, чувства, действия или результат?", ""], ["Чем ситуации отличаются?", ""], ["Моё предположение: «В похожих ситуациях я обычно…»", "Если закономерности нет, так и напишите."]]], ["Аудио 4", "Что попробовать иначе?", "Выберите одно небольшое и безопасное действие, которое зависит от вас.", [["Как я обычно реагирую?", ""], ["Какое одно маленькое действие я могу попробовать?", "Например: «Я отвечу завтра, когда подумаю»."], ["В какой ситуации я попробую это действие?", ""], ["Когда произойдёт Х, я сделаю Y", "Когда …, я …"]]], ["Итоговая карта", "Моя карта повтора", "Соберите главное из четырёх аудио. Можно вернуться к этой странице позже.", [["Моя ситуация или тема", ""], ["Что я заметил(а) в привычной реакции", ""], ["Что объединяет три случая или чем они различаются", ""], ["Моё предположение о повторе", "Если закономерности нет, так и напишите."], ["Моё одно безопасное микродействие", ""]]], ["После практики", "Мой следующий шаг", "Необязательная страница: вернитесь к ней через несколько дней.", [["В какой ситуации я заметил(а) знакомую реакцию?", ""], ["Что я сделал(а)? Что произошло?", ""], ["Что я хочу сохранить или изменить в следующем эксперименте?", ""]]]];const KEY='tochka-povtora-v2-mobile';let answers={},step=0;try{answers=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){};const $=id=>document.getElementById(id);function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem(KEY,JSON.stringify(answers));$('status').textContent='Сохранено на устройстве'}catch(e){$('status').textContent='Автосохранение недоступно — скачайте ответы';$('status').classList.add('warn')}}function render(){const [tag,title,desc,qs]=sections[step];$('counter').textContent=`Раздел ${step+1} из ${sections.length}`;$('bar').style.width=((step+1)/sections.length*100)+'%';let h=`<div class="step">${escapeHTML(tag)}</div><h2>${escapeHTML(title)}</h2><p>${escapeHTML(desc)}</p>`;if(step===0)h+=`<div class="note"><b>Как выбрать ситуацию:</b> не «я всегда молчу в конфликтах», а «в пятницу коллега перебила меня, и я ничего не сказала». В аудио 1 и 2 разбирайте один эпизод. В аудио 3 добавьте ещё два. Останавливайте аудио, чтобы записывать ответы.</div>`;if(step===3)h+=`<div class="note">Случай №1 — эпизод из аудио 1 и 2. Случаи №2 и №3 — другие конкретные эпизоды. Они могут быть из разных сфер жизни.</div>`;if(step===6)h+=`<div class="note">Если сходства не нашлись — это тоже результат. Не подгоняйте ответы под готовую модель.</div>`;if(step===7)h+=`<div class="note">Примеры: «Я проверю загрузку и отвечу через час», «Мне нужно подумать, отвечу завтра». Это только варианты, а не готовые ответы.</div>`;qs.forEach(([q,hint],i)=>{let k=step+'_'+i;h+=`<label for="q${i}">${i+1}. ${escapeHTML(q)}</label><textarea id="q${i}" data-key="${k}" placeholder="${escapeHTML(hint||'Ваш ответ…')}">${escapeHTML(answers[k]||'')}</textarea>`});if(step===9)h+=`<div class="note"><b>Необязательные отметки:</b>${['Я заметил(а) знакомую реакцию','Я попробовал(а) выбранное действие','Я записал(а), что получилось','Я решил(а), что попробовать в следующий раз'].map((x,i)=>`<label class="check"><input type="checkbox" data-check="${i}" ${answers['c'+i]?'checked':''}>${x}</label>`).join('')}</div>`;h+=`<details><summary>Как пользоваться тетрадью</summary><p>Ответы сохраняются в браузере этого устройства. Чтобы не потерять их при очистке браузера или смене телефона, нажмите «Скачать ответы». Вы сможете восстановить их кнопкой «Загрузить сохранённые ответы». Для сохранения в PDF используйте «Печать / PDF».</p></details>`;$('content').innerHTML=h;document.querySelectorAll('textarea').forEach(el=>el.addEventListener('input',()=>{answers[el.dataset.key]=el.value;save()}));document.querySelectorAll('[data-check]').forEach(el=>el.addEventListener('change',()=>{answers['c'+el.dataset.check]=el.checked;save()}));$('prev').disabled=step===0;$('next').textContent=step===sections.length-1?'К началу ↺':'Далее →'}function go(n){step=(n+sections.length)%sections.length;render();window.scrollTo({top:0,behavior:'smooth'})} $('prev').onclick=()=>go(step-1);$('next').onclick=()=>go(step+1);function download(name,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('save').onclick=()=>download('tochka-povtora-moi-otvety.json',JSON.stringify({version:2,answers},null,2),'application/json');$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!obj.answers||typeof obj.answers!=='object'||Array.isArray(obj.answers))throw Error();if(!confirm('Заменить текущие ответы данными из файла?'))return;answers=obj.answers;save();render()}catch(e){alert('Не удалось прочитать файл ответов')}finally{$('file').value=''}};$('reset').onclick=()=>{if(confirm('Удалить все ответы с этого устройства? Это нельзя отменить.')){answers={};save();render()}};$('print').onclick=()=>{let original=step;let body=sections.map(([tag,title,desc,qs],s)=>`<section style="break-inside:avoid;margin:20px 0"><h2>${escapeHTML(tag)} · ${escapeHTML(title)}</h2><p>${escapeHTML(desc)}</p>${qs.map(([q],i)=>`<p><b>${escapeHTML(q)}</b></p><p style="white-space:pre-wrap;min-height:28px">${escapeHTML(answers[s+'_'+i]||'—')}</p>`).join('')}</section>`).join('');let w=window.open('','_blank');if(!w){alert('Разрешите всплывающие окна для сохранения PDF');return}w.document.write(`<html lang="ru"><head><meta charset="utf-8"><title>Мои ответы — Точка повтора</title><style>body{font:14px/1.5 Arial,sans-serif;max-width:760px;margin:35px auto;color:#43545b;padding:0 20px}h2{break-after:avoid;border-bottom:1px solid #ccd8d4;padding-bottom:7px}p{overflow-wrap:anywhere}@media print{body{margin:0;padding:0}}</style></head><body><h1>Точка повтора — мои ответы</h1>${body}</body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),400)};render();
</script></body></html>
